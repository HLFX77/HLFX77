name: LANScreen
options:
  bundleIdPrefix: com.lanscreen
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: "158.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  LANScreenShared:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lanscreen.app.shared
        PRODUCT_MODULE_NAME: LANScreenShared
        GENERATE_INFOPLIST_FILE: true
        APPLICATION_EXTENSION_API_ONLY: true
        DEFINES_MODULE: true
        SKIP_INSTALL: true
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  LANScreenBroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/BroadcastExtension
      - path: Sources/WebRTC
    entitlements:
      path: Sources/BroadcastExtension/LANScreenBroadcastExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lanscreen.app.broadcast
        INFOPLIST_FILE: Sources/BroadcastExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    dependencies:
      - target: LANScreenShared
        embed: false
      - package: WebRTC
        embed: false

  LANScreen:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/WebRTC
    entitlements:
      path: Sources/App/LANScreen.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lanscreen.app
        INFOPLIST_FILE: Sources/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - target: LANScreenShared
        embed: true
      - target: LANScreenBroadcastExtension
        embed: true
      - package: WebRTC
        embed: true

  LANScreenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LANScreenTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lanscreen.app.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LANScreen.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LANScreen"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: LANScreen
      - target: LANScreenShared
        embed: false

schemes:
  LANScreen:
    build:
      targets:
        LANScreen: all
        LANScreenBroadcastExtension: all
        LANScreenShared: all
        LANScreenTests: [test]
    test:
      config: Debug
      targets:
        - name: LANScreenTests
          parallelizable: false
