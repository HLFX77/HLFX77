name: Build LAN SCREEN IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-package-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Resolve SPM Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LANScreen.xcodeproj \
            -scheme LANScreen

      - name: Run Unit Tests
        run: |
          SIM_ID=$(xcrun simctl list devices available iPhone -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next((x['udid'] for k in sorted(d.keys(), reverse=True) for x in d[k] if x.get('isAvailable') and 'iPhone' in x.get('name','')), ''))")
          echo "Using Simulator UDID: $SIM_ID"
          xcodebuild test \
            -project LANScreen.xcodeproj \
            -scheme LANScreen \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build Unsigned Release iOS App & Package IPA
        run: |
          chmod +x scripts/package_unsigned_ipa.sh
          ./scripts/package_unsigned_ipa.sh

      - name: Upload LANScreen-unsigned.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LANScreen-unsigned-ipa
          path: build/ipa/LANScreen-unsigned.ipa
          if-no-files-found: error
